name: Build Release APK

# Builds the "focusWebkit" release variant (the only fully-wired product/engine
# combination in this repo — see app/build.gradle productFlavors).
#
# Trigger manually from the Actions tab, on version tags, or on pushes to main.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # sourceCompatibility/targetCompatibility in app/build.gradle is Java 8,
      # and this project's AGP/Gradle versions are old enough that a newer JDK
      # can fail to configure the build — JDK 8 matches what the project expects.
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # google-services.json / Firebase env vars are optional — app/build.gradle
      # just warns and disables Firebase-backed features when they're absent, so
      # the build still succeeds without them.
      - name: Build release APK (assembleFocusWebkitRelease)
        run: ./gradlew assembleFocusWebkitRelease --stacktrace --no-daemon

      - name: Locate unsigned APK
        id: find_apk
        run: |
          # AGP names output APKs with hyphens per flavor dimension, e.g.
          # app-focus-webkit-release-unsigned.apk, under
          # app/build/outputs/apk/focusWebkit/release/ (camelCase directory,
          # hyphenated filename) - search broadly instead of guessing the
          # exact filename.
          APK_PATH=$(find app/build/outputs/apk/focusWebkit/release -iname "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No release APK found under app/build/outputs/apk/focusWebkit/release" >&2
            find app/build/outputs/apk -iname "*.apk" >&2 || true
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_dir=$(dirname "$APK_PATH")" >> "$GITHUB_OUTPUT"

      # Signing is optional and only runs if a keystore secret has been configured
      # in the repo (Settings -> Secrets and variables -> Actions):
      #   SIGNING_KEY_BASE64   - `base64 -w0 your-release.keystore` output
      #   KEY_STORE_PASSWORD   - keystore password
      #   KEY_ALIAS            - key alias
      #   KEY_PASSWORD         - key password
      # Without these secrets the workflow still succeeds and uploads the
      # unsigned APK produced by Gradle.
      - name: Decode keystore
        id: keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          # The `secrets` context can't be used in an `if:` condition, so the
          # presence check happens here in the shell instead, via env.
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            echo "$SIGNING_KEY_BASE64" | base64 -d > release.keystore
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign release APK
        if: steps.keystore.outputs.has_keystore == 'true'
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: ${{ steps.find_apk.outputs.apk_dir }}
          signingKeyBase64: ${{ secrets.SIGNING_KEY_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "28.0.3"

      - name: Upload signed APK
        if: steps.keystore.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: firefoxlite-release-signed
          path: ${{ steps.sign_apk.outputs.signedReleaseFile }}
          if-no-files-found: error

      - name: Upload unsigned APK
        if: steps.keystore.outputs.has_keystore != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: firefoxlite-release-unsigned
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
