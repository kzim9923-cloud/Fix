// Top-level build file where you can add configuration options common to all sub-projects/modules.
apply from: 'buildSrc/ktlint.gradle'

buildscript {
    repositories {
        google()
        jcenter()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:${Versions.android_gradle_plugin}"
        classpath "com.google.android.gms:oss-licenses-plugin:${Versions.gms_oss_licenses_plugin}"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${Versions.kotlin}"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:${Versions.navigation}"
        classpath 'com.google.firebase:perf-plugin:1.3.1'  // Performance Monitoring plugin

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        maven {
            url "https://maven.mozilla.org/maven2"
        }
        jcenter()
        // jcenter() was shut down for new uploads in 2021 and only serves previously
        // published artifacts read-only. mavenCentral() is added as a fallback so builds
        // don't break if a dependency version is missing/unavailable there.
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}